plugins {
    id 'com.android.application'
}

// 读取签名配置（/jks/keystore.properties）。文件不存在时不配置签名，仅用于 debug/未配置情形。
def keystorePropertiesFile = rootProject.file('jks/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.xtrail.navdash'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xtrail.navdash'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// kotlin-stdlib 与 kotlin-stdlib-jdk7/jdk8 由不同 androidx 依赖传递、版本不一致导致重复类，
// 统一强制到 1.8.22（jdk7/jdk8 在该版本只是转发到 stdlib，类不重复）
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    // Media3 ExoPlayer：播放（本地音乐 / 在线 URL），驱动真音频（A2DP）+ MediaSession
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // 基本 UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // Material Components（BottomNavigationView / SwitchMaterial / Slider / MaterialButton）
    implementation 'com.google.android.material:material:1.12.0'
}
